# RankPublish local WordPress mirror for Cloud Agent (Linux).
# MySQL uses host networking (bridge inter-container traffic is blocked on some cloud VMs).
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    network_mode: host
    command: --port=3307 --bind-address=0.0.0.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - rp_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3307", "-uwordpress", "-pwordpress"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.7-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: host.docker.internal:3307
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - ../../../.cloud-local-wp/public:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ | grep -qv 'Error establishing a database connection'"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  rp_db:
