# Nginx for Nashir on Contabo / ServerAvatar
# Copy to /etc/nginx/sites-available/nashir and symlink sites-enabled.
# Replace server_name and SSL paths with the ServerAvatar trial domain.

upstream nashir_next {
  server 127.0.0.1:3001;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name SERVERAVATAR_TRIAL_DOMAIN;

  location / {
    proxy_pass http://nashir_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name SERVERAVATAR_TRIAL_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/SERVERAVATAR_TRIAL_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/SERVERAVATAR_TRIAL_DOMAIN/privkey.pem;
  client_max_body_size 32m;

  location / {
    proxy_pass http://nashir_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
