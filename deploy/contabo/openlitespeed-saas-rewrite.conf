# RankPublish SaaS reverse proxy (OpenLiteSpeed / ServerAvatar)
# Proxies SaaS routes to Next.js on 127.0.0.1:3001

RewriteEngine On

# Next.js static assets
RewriteRule ^_next/(.*)$ http://127.0.0.1:3001/_next/$1 [P,L,E=Proxy-Host:nashir.satest.top]

# SaaS app routes
RewriteRule ^app(/.*|$) http://127.0.0.1:3001/app$1 [P,L,E=Proxy-Host:nashir.satest.top]
RewriteRule ^api(/.*|$) http://127.0.0.1:3001/api$1 [P,L,E=Proxy-Host:nashir.satest.top]
RewriteRule ^login(/.*|$) http://127.0.0.1:3001/login$1 [P,L,E=Proxy-Host:nashir.satest.top]
RewriteRule ^register(/.*|$) http://127.0.0.1:3001/register$1 [P,L,E=Proxy-Host:nashir.satest.top]
RewriteRule ^privacy(/.*|$) http://127.0.0.1:3001/privacy$1 [P,L,E=Proxy-Host:nashir.satest.top]
RewriteRule ^terms(/.*|$) http://127.0.0.1:3001/terms$1 [P,L,E=Proxy-Host:nashir.satest.top]
RewriteRule ^sitemap\.xml$ http://127.0.0.1:3001/sitemap.xml [P,L,E=Proxy-Host:nashir.satest.top]
