name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: SaaS lint, schema, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      - name: Prisma validate (no database writes)
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
        run: npx prisma validate
      - name: Schema must never drop WordPress tables
        run: |
          if grep -qiE 'drop[[:space:]]+table[[:space:]]+.*wp_' prisma/create-rp-tables.sql ../../deploy/contabo/staging-schema-safe.sql; then
            echo "Refusing SQL that drops wp_* tables"
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - name: Next.js build
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
        run: npx next build
